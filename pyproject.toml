[project]
name = "auditlogger"
version = "1.0.0"
description = "Windows audit logger for IP, network, and system events."
requires-python = ">=3.11"
dependencies = [
    "requests (==2.34.2)",
    "tplinkrouterc6u>=5.29.0",
    "librouteros>=4.1.1",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[project.scripts]
auditlogger = "auditlogger.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"