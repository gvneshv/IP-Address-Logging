storage:
  log_file: logs/audit.jsonl
  archive_dir: logs/archive
  backup_dirs: []

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""  # the chat the bot posts INTO - for a private DM with your own bot, this is YOUR numeric Telegram user ID, not the bot's.
               # See README for how to find it.

email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_use_ssl: false  # false (default) = STARTTLS on 587; true = implicit TLS, typically port 465
  username: ""
  password: ""
  from_address: ""
  to_address: ""

notifications:
  notify_on:
    wan_change: true          # default - WAN reconnects/lease renewals more often than the external IP itself
    external_ip_change: false
    conn_type_change: false   # static vs dynamic WAN connection type
    wan_mac_change: false
    dns_change: false         # either DNS server changing

scheduler:
  windows_startup_task_name: AuditLogger

router:
  enabled: true
  include_device_list: false  # per-device MAC/hostname/IP for every connected client - off by default (privacy)
  connection:
    address: "http://192.168.0.1"   # TP-Link: your router's admin URL. MikroTik: bare host/IP, no scheme (e.g. "192.168.0.1") - it connects over the RouterOS API port, not HTTP.
    username: "admin"
    password: "YOUR_ADMIN_PASSWORD"  # the router admin login, not the WiFi password
    timeout: 30
    verify_tls: false  # MikroTik: false = plain RouterOS API on port 8728, true = API-SSL on port 8729 (untested - see MikrotikProvider docstring)
  detection:
    type: "tplink"  # or "mikrotik"
  wan_interface: "ether1"  # MikroTik only, required for detection.type: "mikrotik" - the RouterOS interface name that carries the WAN address. RouterOS has no fixed WAN port like TP-Link hardware does, so this can't be auto-detected.

logging:
  level: INFO
  log_file: logs/auditlogger.log